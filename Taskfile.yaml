version: '3'

tasks:
  build:
    desc: Build a local binary
    cmd: go build -o evolve-deploy .

  format:
    desc: Format code — run before committing
    cmds:
      - go fmt ./...
      - go mod tidy

  # Pinned to the version CI decides the build with. A newer local golangci-lint
  # is stricter or laxer than the one that has the vote, which turns a green run
  # here into a red one there. The two --max flags are not cosmetic: by default
  # the same finding is reported three times at most, so "3 issues" can mean
  # five, and the next run fails on the two it never showed.
  lint:
    desc: Run the linters
    cmd: >
      go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run
      --max-same-issues=0 --max-issues-per-linter=0

  # -race because that is how CI runs them, and a data race that only shows up
  # there is a race nobody can reproduce.
  test:
    desc: Run all tests
    cmd: go test -race ./...

  coverage:
    desc: Test with a coverage summary
    cmds:
      - go test -race -coverprofile=coverage.txt -covermode=atomic -coverpkg=./... ./...
      - go tool cover -func=coverage.txt

  coverage-html:
    desc: Test with an HTML coverage report
    cmds:
      - go test -race -coverprofile=coverage.txt -covermode=atomic -coverpkg=./... ./...
      - go tool cover -html=coverage.txt

  snapshot:
    desc: Build release artifacts without publishing
    cmd: goreleaser build --snapshot --clean
