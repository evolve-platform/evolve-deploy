name: Generate release pull request

on:
  push:
    branches: ["main"]

permissions: {}

jobs:
  generate-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release branch, create the tag and release
      pull-requests: write # open the release pull request
      actions: write # dispatch release.yaml
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Prepare release
        uses: labd/changie-release-action@43112f435367957ee3fefc64b3b712c7e672be33 # v0.6.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          release-workflow: release.yaml
