# evolve-platform, GCP test environment.
cloud:
  provider: gcp
  project: evolve-tst
  region: europe-west4

services:
  purchase:
    version: abc1234
    type: cloud-run
    env:
      LOG_LEVEL: info
      # Cloud Run resolves this itself through secretKeyRef; the value never
      # passes through the deploy.
      CTP_CLIENT_SECRET: ${secret:purchase-ctp-client-secret}
    before:
      - hive schema:check --service purchase --commit {{.version}}
    after:
      - hive schema:publish --service purchase --commit {{.version}}

  # One image, three deployables, one version written once: the sync jobs run
  # the same build as the service, with different arguments Terraform gave them.
  catalog-commercetools:
    version: abc1234
    targets:
      - { type: cloud-run,     name: catalog-commercetools }
      - { type: cloud-run-job, name: catalog-ct-products }
      - { type: cloud-run-job, name: catalog-ct-categories }

  site:
    version: def5678
    type: cloud-run
