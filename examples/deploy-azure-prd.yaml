# evolve-reference-b2b, production.
#
# Same file as tst, with one addition: production releases a side at a time.
# Terraform sets revision_mode = "Multiple" and bootstraps the traffic block,
# then lets go of it — see specs/blue-green.md for the one extra ignore_changes.
cloud:
  provider: azure
  subscription: 00000000-0000-0000-0000-000000000000
  resource_group: evolve-prd
  # Only needed because a ${param:…} reference is used below.
  app_config: https://evolve-prd.azconfig.io

strategy:
  type: blue-green

  # One gate for the whole release. It runs once, after everything has staged
  # and before any traffic moves — so what it checks is a complete side, not one
  # app of it.
  #
  # A release has no single address, so a command names what it wants. As a
  # function and not a field: a template field has to be an identifier, and
  # {{.catalog-commercetools.url}} does not even parse.
  smoke:
    # Retrying is the point of asking this way round. The revisions have only
    # just become ready, so the first call may well 503 — and a curl line that
    # gets --fail wrong is a gate a 500 walks straight through.
    - uses: http
      with: { url: '{{url "purchase"}}/healthz', retry: 5, delay: 2s }
    - uses: http
      with: { url: '{{url "discover"}}/healthz', retry: 5, delay: 2s }
    # And the one worth more than the sum of those: a request through the staged
    # side, end to end. Anything the tool has no opinion about stays a command.
    - npm run smoke -- --base-url {{url "site"}}

services:
  purchase:
    version: 27ec167
    type: container-app
    env:
      LOG_LEVEL: info
      CTP_CLIENT_SECRET: ${secret:ctp-client-secret}
    before:
      - hive schema:check --service purchase --target {{.env}}
    after:
      - hive schema:publish --service purchase --target {{.env}}
      # A marker on the graph at the moment the graph changes shape. It cannot
      # fail the release: a note that did not arrive is worth less than the
      # version it was about. The key comes from HONEYCOMB_API_KEY, and a plan
      # refuses if that is not set.
      - uses: honeycomb
        with:
          dataset: purchase
          endpoint: https://api.eu1.honeycomb.io
          url: https://github.com/evolve-platform/evolve-reference-b2b/commit/{{.version}}
      - uses: sentry
        with: { org: evolve, commit: '{{.version}}', repository: evolve-platform/evolve-reference-b2b }

  # One image, three deployables. The jobs carry no traffic, so they ride along:
  # their templates are written at the switch, never before it.
  discover:
    version: 27ec167
    envFrom:
      - ${param:/evolve/${env}/discover/setup}
    targets:
      - { type: container-app,     name: evolve-prd-discover }
      - { type: container-app-job, name: evolve-prd-discover-products }
      - { type: container-app-job, name: evolve-prd-discover-categories }

  site:
    version: def5678
    type: container-app

  # Not every service has to be released a side at a time. This one is written
  # straight, the way everything is by default — so it stages nothing, and the
  # smoke steps above cannot name it.
  catalog-commercetools:
    version: 27ec167
    type: container-app
    strategy:
      type: direct
