kind: Fixed
body: The first blue-green deploy of a Container App whose traffic Terraform bootstrapped as `latestRevision` no longer fails with `ContainerAppTrafficWeightIncorrectValue`. The pin before staging named no revision and sent Azure an empty traffic block; it now names the app's latest ready revision, and refuses with an explanation when there is none yet.
time: 2026-11-09T10:30:00Z
