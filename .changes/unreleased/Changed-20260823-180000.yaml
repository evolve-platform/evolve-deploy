kind: Changed
body: 'A failed blue-green release now reads as one release rather than as a row in a table of services, and it ends on what is serving. It used to open with "1 service(s) failed" above a list of three container apps — the staged side is one unit of work, so the count was right and useless — and it never said the one thing worth knowing first: that no traffic moved and the previous version is still up. The failure now names the phase it died in (`the release failed while staging blue after 10m38s`), lists a line per target, and closes with `No traffic moved: green still serves the version it served before, and the blue revisions were switched off` — or, when the cleanup itself failed, says that instead rather than offering a reassurance the list below it contradicts. A switch that fails says the traffic is back on the side it came from, and an after hook that fails says the deploy worked and nothing was rolled back, because that is the opposite situation and used to look identical. The cleanup also prints as it goes: abandoning a side was silent, so the answer to "is the staged side still running and still being charged for" was a trip to the portal. On Container Apps the line itself is shorter and says more. The app name was in it three times and the platform''s own wording buried the fact — `is Unhealthy — main is Waiting (Container is waiting with reason: CrashLoopBackOff on legion.), 5 restart(s)` is now `revision evolve-tst-discover--0000039 never started (container main: CrashLoopBackOff, restarted 5 times)`, followed by the `az containerapp logs show` command for that revision and that container, since whatever the process printed before it exited is the next thing to look at and it is not in the deploy log.'
