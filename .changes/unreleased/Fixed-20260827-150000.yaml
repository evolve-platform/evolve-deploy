kind: Fixed
body: 'A blue-green Cloud Run release no longer stages the running container over what Terraform declares. Only the image and the environment are read from the serving revision — the two fields a deploy owns and Terraform is told to ignore, so the service template is not current for either. Everything else on the container is Terraform''s and now comes from the service, the same as scaling, service account and VPC access one level up. Taking the whole container meant ports, probes, cpu and memory travelled with it: an apply that changed a probe created a revision carrying no traffic, and the next release put the old values straight back on the side it staged. Found as a liveness probe that kept polling the port the service had been moved off, which failed every check and had each instance killed under it.'
