kind: Fixed
body: 'A Container App revision whose container dies on start now fails the release in about a minute instead of running the wait out to its ten-minute deadline. Container Apps leaves such a revision in `Processing` — it is still restarting the container, so by its own account nothing has gone wrong yet — and the wait believed it, because the fact that settles the question lives a level down: the replica''s restart count. That count was only ever read once the revision had already admitted to being Degraded or Unhealthy, which for an image that exits immediately can take the better part of the deadline it was supposed to pre-empt. The replicas are now read on every poll while a revision is not yet serving, and a container past its third restart ends the wait whatever the revision says about itself — with the same message as before, naming the container and the command that shows what it printed. A container that is merely slow is unaffected: it has not died, so there is nothing to report and the strike count stays where it was.'
