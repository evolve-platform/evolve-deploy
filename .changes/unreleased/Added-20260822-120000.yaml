kind: Added
body: 'A hook entry can now be a named action instead of a command line. `uses: honeycomb` marks the deploy on a dataset, `uses: sentry` registers the release and the deploy of it, and `uses: http` asks for one url and says whether the answer was the expected one. A plain string still means what it always did and `cmd:` is the same thing written out, so nothing in an existing file has to change. The three exist because they were never really commands: a Honeycomb marker written as curl is six lines of flags, a hand-built JSON body, a header out of an environment variable and a `|| echo` on the end so that a failed annotation does not fail the release — and every value in it is something the tool already knows. An action is given those, and it can refuse while there is still a plan to refuse: a marker whose API key is nowhere in the environment fails the plan, naming the variable, rather than turning up as a 401 from an `after` hook on a release that already succeeded. A marker that fails for any other reason is reported and forgiven, which is what the `|| echo` was doing. `uses: http` retries on a refused connection as much as on a bad status, because a side that has staged is not always answering the instant staging returns — and it cannot be written without the equivalent of `--fail`, which is how a 500 used to walk through a gate. `strategy.smoke` takes the same three forms. The plan''s dry run now renders a blue-green service''s hooks with the side variables it will actually be given: `{{.label}}` failed to render there and printed nothing at all, which read as a service with no hooks.'
