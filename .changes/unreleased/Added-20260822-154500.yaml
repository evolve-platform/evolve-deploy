kind: Added
body: 'A documentation site at https://deploy.evolve-platform.com, built from `docs/` and published on every push to main. The README had grown to eight hundred and forty lines covering install, config, references, hooks, blue-green across three clouds and what Terraform has to declare — all of it worth keeping and none of it findable, because a reader who wants to know what `${secret:}` means on Azure should not have to scroll past the ECS section to find out. The same material is now a site with search and a sidebar, split so that each page answers one question, plus the pages a README has no room for: a first deploy walked through end to end, GitHub Actions with the `setup-evolve-deploy` action and cloud OIDC, copyable workflow recipes for drift detection and a rollback button, and a per-cloud table for the blue-green differences that decide which platform is safe to be brave on. The README is now eighty-five lines — what the tool is, how to install it, how to work on it, and where the rest went — which also retires its link to a spec that was never committed. Internal links on the site are relative and checked against the built output on every pull request, anchors included, so a page that moves cannot leave dead links behind it.'
