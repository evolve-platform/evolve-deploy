kind: Fixed
body: 'A blue-green revision is staged from the container app''s own template rather than from the serving revision''s, so a probe, a cpu change or an environment variable Terraform declares reaches the next release instead of being staged over every time — previously such a change created a revision with no traffic and was reverted rather than delayed. The serving revision is still where the running version and the environment diff are read from, because with two live revisions the app''s template is whichever was created last, which after a failed gate is the attempt that was abandoned; comparing against that would report the retry as already up to date.'
