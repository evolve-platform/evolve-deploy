kind: Fixed
body: 'A Cloud Run blue-green release no longer stages the running container back over what Terraform declared. The plan built the next revision on the service''s template and then copied the image and the environment of the serving revision onto every container matching by name, so a change an apply had just made to a sidecar — its image, its whole environment — was reverted by the next release rather than delayed by it, even though the module deliberately keeps a sidecar out of `ignore_changes`. The template is now built on unchanged, the same as a Container App and an ECS task definition, and the serving revision is read rather than copied: it is where the version that is running and the environment diff come from, which is what keeps a retry after a failed gate from reporting itself as already up to date. One behaviour follows from it — a target whose config declares no environment at all now keeps the environment Terraform declares instead of the one on the revision that happens to be serving.'
