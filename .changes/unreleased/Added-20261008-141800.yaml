kind: Added
body: 'The config file has a JSON Schema, and the tool checks every file against it before reading it. A mistake is now reported under the path of the key it is about, with the line it is on, alongside every other mistake in the file — where the decoder used to stop at the first value it could not place and name a Go type (`cannot unmarshal !!str into []string`, `field comand not found in type config.Target`). A misspelt key or value says what it was probably meant to be, and a key that belongs elsewhere says why: `does not apply when type is lambda`. Each release publishes the schema at `https://deploy.evolve-platform.com/schema/v<version>.json` and as `latest.json`, so an editor pointed at it with a `# yaml-language-server: $schema=` line checks the file while it is typed, against the same rules; `evolve-deploy schema` prints the one built into the binary. `keep_warm` now takes `true` or `false` only, where the YAML decoder also took `yes` and `on`.'
