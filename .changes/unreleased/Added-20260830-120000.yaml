kind: Added
body: 'A `cloud-run` or `cloud-run-job` target can state its own `command`, so the container''s entry point travels with the version instead of staying behind in Terraform. A command names a path inside the image, which means an image whose layout moves and a command that has not are a job that will not start — and until now those were two writes in two tools with no ordering between them: Terraform applies a command change immediately on a job, where nothing carries traffic and the next execution simply picks it up, while the image only arrives with the next release. Declared here the two land in one write. It sits on a target and never on a service, because a service whose targets all took the same command would be describing one job several times over, and the whole command line goes in it: the declaration is the entry point the way `env` is the environment, so arguments the container carried separately are dropped with it — Cloud Run appends args to command, and a leftover pair would start the container on a line nobody wrote. Omitting it keeps what the target already has, which is what every config written before this goes on doing, so nothing has to change to stay on Terraform''s. A command that moved while the version did not now counts as a change on its own, and the plan says `command changed` rather than `environment changed`, which was the only reason left that an unchanged version could carry. It is refused on the other target types rather than accepted and ignored — Container Apps and ECS can both express an entry point, so that is a driver nobody has written yet and the message says as much.'
