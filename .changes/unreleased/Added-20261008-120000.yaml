kind: Added
body: 'A hook can run a job: `uses: job` with the job''s `name` starts one execution of a Container Apps job on Azure or a Cloud Run job on GCP, on the version being released, and waits for it to finish — so a migration goes in `before` and gates the release like any other hook, and a permissions load goes in `after`. The image is written onto the job first, because a migration has to run against what is about to go out rather than what is serving, and on Cloud Run there is no other way to give an execution an image. A `command` runs that command line instead of the job''s own for that one run, and the job gets Terraform''s command back afterwards whether the run worked or not, so the next run without one does not run the last one''s. The job is Terraform''s and is never created here: a job that does not exist is refused while planning, with nothing written, and so is a `uses: job` on AWS, which has no jobs a hook can run. Like every hook it prints nothing when it succeeds; a failed execution names itself and, on Cloud Run, links to its logs.'
