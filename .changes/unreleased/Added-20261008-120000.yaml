kind: Added
body: 'A hook can run a job: `uses: container-app-job` on Azure, `cloud-run-job` on GCP or `ecs-task` on AWS — each cloud''s own name, the same as its target type, with the name for another cloud refused while planning — starts one run of the job named by `name`, on the version being released, and waits for it to finish — so a migration goes in `before` and gates the release like any other hook, and a permissions load goes in `after`. The image is written onto the job first, because a migration has to run against what is about to go out rather than what is serving, and neither Cloud Run nor ECS can give a run an image any other way. A `command` runs that command line instead of the job''s own for that one run; on Azure and GCP the job gets Terraform''s command back afterwards whether the run worked or not, so the next run without one does not run the last one''s. On AWS, where there is no job resource, the job is what `before_deploy` was in ecs-deplojo — a task definition family, registered per run from Terraform''s `<name>-base` like an ecs target, and a RunTask — except that it waits and judges the run by the container''s exit code, and starts the task in the cluster and network of the service''s own ecs target, without which a Fargate task does not start; `target` names another, and `base` another family, both refused on the other two. A `timeout` stops a run that takes longer and fails the hook — stopped rather than walked away from, because a migration still running under a release that went ahead is what it is for; on AWS, where ECS keeps no task timeout, it is the only one there is. The job is Terraform''s and is never created here: one that does not exist is refused while planning, with nothing written. Like every hook it prints nothing when it succeeds; a failed run names itself and says where its logs are.'
