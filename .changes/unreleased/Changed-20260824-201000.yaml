kind: Changed
body: '`{{url "svc"}}` now means the address that survives the release rather than the staged side, and inside `strategy.smoke` it is refused rather than quietly re-pointed. That refusal is the whole point: resolved silently, every existing smoke block would keep rendering, keep passing, and start testing the version the release is replacing — green, with nothing behind it. A smoke block now has to say which address it means, and the refusal offers both: `{{url_stage "svc"}}` for the side this release staged, `{{url_public "svc"}}` for the one still serving the old version. It fails at plan time, so nothing deploys before the config is corrected, and outside a smoke block nothing changes: `url` never worked in a hook at all.'
