kind: Added
body: 'Blue-green deployments for Azure Container Apps. `strategy: blue-green` stages a release on the side that carries no traffic, runs the `smoke` commands against it and switches in one write, leaving the previous version running at 0% so a rollback is one write and no container start. A release is one release: everything is staged first, then every smoke command runs, then all of the traffic moves — including services with nothing to change, staged at the version they already run, because the side belongs to the environment and a side missing an app is not a stack you can point a smoke test at. Nothing is staged when nothing changed, so a second apply is still a no-op. Active is the label with 100% of the traffic; a split, an environment whose apps disagree about which side is idle, and a `depends_on` between two blue-green services are all refused while planning. `strategy.env.<label>` gives each side the variables it needs to reach its own downstream — the router on green reading the green graph, the storefront on green calling the green router — additively, and excluded from the diff because those values differ by side by definition. Every blue-green target also gets `EVOLVE_DEPLOY_SIDE`. `evolve-deploy traffic` shows which side is serving and `--to <label>` moves all of it in one write, which is both the manual rollback and the way out of a split. Hooks get `{{.label}}` and `{{.previous_label}}`, `smoke` gates the release rather than a service, so it lives at file level, runs once, and names what it wants with `{{url \"site\"}}` because a release has no single address, `--var name=value` passes in what a deploy config cannot know, and hook lines are now rendered while planning so a mistyped variable fails the plan instead of an `after` hook on a release that already succeeded.'
