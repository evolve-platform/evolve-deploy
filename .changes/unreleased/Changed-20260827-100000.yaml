kind: Changed
body: 'A blue-green switch on Cloud Run now takes the tag off the side that stops serving, so that side is retired by the platform instead of being paid for until the next release. A tag is an address — `blue---service.run.app` answers whether or not any traffic is split that way — so an idle side that kept its tag was never retired, and on a service whose template carries `scaling.min_instance_count` it went on holding that floor indefinitely: one extra instance per service, permanently, since each release leaves a new idle revision holding one. The revision a rollback needs is recorded in an `evolve-deploy/rollback` annotation on the service instead. It has to live there rather than on the revision, because revisions are immutable and the revision that must be named is the one that stopped serving a moment ago; a write masked to the service''s annotations touches no template, so it creates no revision of its own. The note is written before the traffic moves, so the failure that can be left behind is a note naming a side that is still serving, which is a rollback to where you already are and is ignored on the next read. Nothing is deleted and `rollback` is unaffected in what it can reach — it re-tags the recorded revision and moves the traffic to it, a cold start as before. A service deployed before this exists still has both tags in its traffic block, and those are still read in preference to the note, so no release has to go first. What is gone is the idle side''s own URL: there is no longer an address to curl the previous version on before deciding to go back to it. This also makes two things the tool already printed true rather than nearly true — the `(scaled to zero)` on the rollback line, and the reasoning the `keep_warm` refusal gives.'
