kind: Changed
body: 'The deploy config is now the whole environment of a target rather than a layer over it, so a variable it does not name is removed. It had to be one or the other: on Azure a container''s `env` is on Terraform''s `ignore_changes`, so Terraform writes one at create and can never correct it, and a tool that only laid its own variables on top could not remove one either — a variable set once outlived every release and went on outranking whatever was meant to replace it, with nothing in the system able to say what the environment was. Container Apps, Container App jobs, Cloud Run and ECS all read it the same way, though only Azure forced it: a Cloud Run service is Terraform''s to correct, and an ECS base task definition is registered whole so a variable dropped there did reach the next release. They follow anyway, because a list of variables that means the environment on one cloud and a patch over an unseen one on another is not something a reader of a deploy file can be asked to keep track of. On ECS this also retires the bookkeeping that kept a name out of `environment` once it moved to `secrets`: both lists are now built from the one declaration and cannot disagree. A config that declares no environment at all still changes nothing, so an image-only deploy is unaffected, and a sidecar''s environment stays Terraform''s. `--allow-env-removal` is gone with it: a removal is now something written in the config and read in a diff, not a sign that Terraform quietly stopped declaring something, so interrupting a release for it bought nothing. Removals still appear in `diff` and in the plan. Configuration that used to reach a service by being left on the resource belongs in App Configuration, Parameter Store or Secret Manager, which the service reads for itself.'
