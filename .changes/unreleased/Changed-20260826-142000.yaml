kind: Changed
body: 'A version the platform keeps no record of now reads `(unknown)` rather than `(none)`, and nothing refuses because of it. The two were the same word before, which was wrong in both directions: `(none)` is the honest answer for a traffic entry that has no tag, and the wrong one for a release that is certainly serving but cannot be named. More than cosmetic in one place — `rollback` compares the version the idle side holds across every target and refuses a set that does not agree, and an unreadable version counted as a value there rather than as the absence of one. Two Cloud Run services, one redeployed since the version started being stamped on the revision and one not, would have had a correct rollback refused for the single reason nobody can act on. An unknown version is now a gap in what can be displayed and never a reason to stop a deploy or a rollback that is otherwise right.'
