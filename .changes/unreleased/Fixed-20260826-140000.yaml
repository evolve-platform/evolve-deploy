kind: Fixed
body: 'A blue-green release on Cloud Run no longer fails at staging with `must be a container image path in the form [hostname/]repo-path[:tag and/or @digest]`. A Cloud Run revision records the image as the digest the tag resolved to and keeps no note of what was written, so the reference read back from a serving revision is `repo@sha256:9ca1640…` even where Terraform declared `repo:8618aae`. Splitting that took the colon in `sha256:` for the tag separator, which made the repository `repo@sha256`, the running version the digest hex — the 64-character hash that showed up in plans as the version being rolled back to — and the image written for the next revision `repo@sha256:8618aae`, which is neither a tag nor a digest. It only surfaced on the blue-green path, because that one reads the serving revision rather than the service template, and only once staging was already under way. A digest is now understood wherever a reference is read, and replaced by the tag being deployed rather than concatenated with it.'
