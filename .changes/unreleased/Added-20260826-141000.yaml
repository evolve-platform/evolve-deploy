kind: Added
body: 'A Cloud Run revision now carries the release it is running as an `evolve-deploy/version` annotation, so `deploy`, `diff`, `traffic` and `rollback` can name the version on each side of a blue-green service. The image cannot answer that question here — Cloud Run stores it as the digest the tag resolved to — and the service''s own template, which does keep the tag, belongs to whichever revision was created last: after a failed deploy that is the one that was abandoned, which is exactly why a blue-green plan reads the serving revision instead. An annotation rather than a label, because a label value may hold neither a dot nor a capital and `v1.2.3` is a tag people use. It is written on staging and read back on the next run, so a side deployed before this exists still reports its version from the image tag where there is one.'
